<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 644" width="1040" height="644" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1040" height="644" fill="#fbfbfa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c0c6"/></marker></defs>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1b1f24">Erasure is reachability, not search</text>
<text x="40" y="68" font-size="12" fill="#6b737c">One subject&#8217;s artifacts, and the strongest layer each store lets us check.</text>
<text x="40" y="112" font-size="10.5" font-weight="700" fill="#6b737c" letter-spacing="0.09em">THE GRAPH</text>
<path d="M 180 249 C 215.0 249, 215.0 249, 242 249" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="215.0" y="243.0" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">chunk</text>
<path d="M 390 249 C 430.0 249, 430.0 159, 462 159" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="430.0" y="198.0" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">embed:&lt;model&gt;</text>
<path d="M 390 249 C 430.0 249, 430.0 249, 462 249" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="430.0" y="243.0" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">cache:*</text>
<path d="M 390 249 C 430.0 249, 430.0 339, 462 339" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="430.0" y="288.0" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">train:shard-N</text>
<path d="M 610 339 C 650.0 339, 650.0 339, 682 339" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650.0" y="333.0" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">adapter:&lt;key&gt;</text>
<path d="M 180 249 C 215.0 249, 215.0 414, 242 414" fill="none" stroke="#b9c0c6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="215.0" y="325.5" text-anchor="middle" font-size="9.5" fill="#6b737c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" stroke="#fbfbfa" stroke-width="3.5" paint-order="stroke">memory</text>
<rect x="40" y="225" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="110" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">SOURCE</text><text x="110" y="261" text-anchor="middle" font-size="10" fill="#6b737c">the document</text>
<rect x="250" y="225" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="320" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">CHUNK</text><text x="320" y="261" text-anchor="middle" font-size="10" fill="#6b737c">unit of retrieval</text>
<rect x="470" y="135" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="540" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">EMBED</text><text x="540" y="171" text-anchor="middle" font-size="10" fill="#6b737c">one per index</text>
<rect x="470" y="225" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="540" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">CACHE</text><text x="540" y="261" text-anchor="middle" font-size="10" fill="#6b737c">exact + semantic</text>
<rect x="470" y="315" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="540" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">TRAIN</text><text x="540" y="351" text-anchor="middle" font-size="10" fill="#6b737c">example in a shard</text>
<rect x="690" y="315" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="760" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">ADAPTER</text><text x="760" y="351" text-anchor="middle" font-size="10" fill="#6b737c">shard weights</text>
<rect x="250" y="390" width="140" height="48" rx="7" fill="#ffffff" stroke="#1b1f24" stroke-width="1.4"/><text x="320" y="411" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1f24">MEMORY</text><text x="320" y="426" text-anchor="middle" font-size="10" fill="#6b737c">agent memory</text>
<text x="40" y="482" font-size="10.5" font-weight="700" fill="#6b737c" letter-spacing="0.09em">WHAT A RECEIPT CAN CLAIM</text>
<rect x="40" y="500" width="228" height="86" rx="7" fill="#ffffff" stroke="#b9c0c6" stroke-width="1.2"/><text x="54" y="522" font-size="12" font-weight="700" fill="#2f6f4f">LOGICAL</text><text x="54" y="540" font-size="9.8" fill="#1b1f24">proves: no query path returns it</text><text x="54" y="570" font-size="9.2" fill="#8a5a2b">but: the bytes may still be on disk</text>
<rect x="284" y="500" width="228" height="86" rx="7" fill="#ffffff" stroke="#b9c0c6" stroke-width="1.2"/><text x="298" y="522" font-size="12" font-weight="700" fill="#2f6f4f">PHYSICAL</text><text x="298" y="540" font-size="9.8" fill="#1b1f24">proves: its bytes are not in the</text><text x="298" y="552" font-size="9.8" fill="#1b1f24">store's files</text><text x="298" y="570" font-size="9.2" fill="#8a5a2b">but: only where the store lets us</text><text x="298" y="581" font-size="9.2" fill="#8a5a2b">read them</text>
<rect x="528" y="500" width="228" height="86" rx="7" fill="#ffffff" stroke="#b9c0c6" stroke-width="1.2"/><text x="542" y="522" font-size="12" font-weight="700" fill="#2f6f4f">SEMANTIC</text><text x="542" y="540" font-size="9.8" fill="#1b1f24">proves: the shape of the hole it</text><text x="542" y="552" font-size="9.8" fill="#1b1f24">left</text><text x="542" y="570" font-size="9.2" fill="#8a5a2b">but: reported, never a pass/fail</text><text x="542" y="581" font-size="9.2" fill="#8a5a2b">gate</text>
<rect x="772" y="500" width="228" height="86" rx="7" fill="#ffffff" stroke="#b9c0c6" stroke-width="1.2"/><text x="786" y="522" font-size="12" font-weight="700" fill="#2f6f4f">MODEL</text><text x="786" y="540" font-size="9.8" fill="#1b1f24">proves: it is not extractable from</text><text x="786" y="552" font-size="9.8" fill="#1b1f24">the weights</text><text x="786" y="570" font-size="9.2" fill="#8a5a2b">but: an attacker with more budget</text><text x="786" y="581" font-size="9.2" fill="#8a5a2b">may differ</text>
<text x="40" y="622" font-size="10.5" fill="#6b737c">A store that cannot be checked at a level reports UNVERIFIED with the reason &#8212; never a pass.</text>
</svg>